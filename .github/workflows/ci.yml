name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip build

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Build package
        run: python -m build

      - name: Install built wheel
        run: python -m pip install dist/*.whl --force-reinstall

      - name: CLI JSON smoke test
        run: shipcheck . --format json > shipcheck.json

      - name: CLI SARIF smoke test
        run: shipcheck . --format sarif > shipcheck.sarif

      - name: Validate SARIF document
        run: python -c "import json; d=json.load(open('shipcheck.sarif')); assert d['version']=='2.1.0'; assert d['runs'][0]['tool']['driver']['name']=='ShipCheck'"
